# Server
server.port=8080

# MySQL
# Password and JWT secret are supplied through the backend process environment
spring.datasource.url=${MEDIBOOK_DB_URL}
spring.datasource.username=${MEDIBOOK_DB_USERNAME}
spring.datasource.password=${MEDIBOOK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# JWT
jwt.secret=${MEDIBOOK_JWT_SECRET}
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.medibook=INFO
logging.level.org.springframework.security=INFO

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MEDIBOOK_MAIL_USERNAME:}
spring.mail.password=${MEDIBOOK_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
