# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/medibook
spring.data.mongodb.database=medibook

# JWT
jwt.secret=MediBookSuperSecretKey2024ThisMustBeAtLeast256BitsLongForSecurity
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.medibook=DEBUG
logging.level.org.springframework.security=INFO

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
